name: CI

on:
  push:
    branches: [moongazer]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: No API keys in tracked files
        working-directory: .
        run: |
          if git ls-files -z | xargs -0 grep -IlE 'AIza[0-9A-Za-z_-]{30,}'; then
            echo "::error::A Google API key is committed. Remove it and use HARIS_MAPS_KEY instead."
            exit 1
          fi

      - name: Build
        run: ./gradlew --no-daemon installDist

      - name: Smoke test (server starts, scenario loads, key placeholder is substituted)
        env:
          HARIS_MAPS_KEY: ci-placeholder-key
        run: |
          mkdir -p log
          build/install/haris-moongazer/bin/haris-moongazer > server.out 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:44101/state.json > /dev/null && break; sleep 1; done
          curl -sf localhost:44101/state.json > /dev/null
          curl -sf -X POST -d 'file-name=AllUITest.json' localhost:44101/mode/scenario > /dev/null
          curl -sf localhost:44101/state.json | grep -q '"gameId": "All UI Test"'
          curl -sf localhost:44101/sandbox.html | grep -q 'key=ci-placeholder-key'
          # Every launch-page tile must load: scenario files exist and images are served
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          base = "http://localhost:44101/"
          tiles = json.load(urllib.request.urlopen(base + "showcase/showcase.json"))["tiles"]
          for t in tiles:
              urllib.request.urlopen(base + t["image"])
              for f in {t["file"], *[v["file"] for v in t.get("variants", [])]}:
                  urllib.request.urlopen(base + "reset", b"")
                  data = urllib.parse.urlencode({"file-name": f}).encode()
                  urllib.request.urlopen(base + "mode/scenario", data)
                  print("ok", t["id"], f)
          PY
          # Strategic/tactical study: loads, opens Studio, and the engine answers
          curl -sf -X POST localhost:44101/reset > /dev/null
          curl -sf -X POST -d 'file-name=StratTac_Study.json' localhost:44101/mode/scenario > /dev/null
          curl -sf localhost:44101/mode/page | grep -q 'studio.html'
          curl -sf localhost:44101/strattac/config | grep -q '"enabled": true'
          curl -sf localhost:44101/strattac/state | grep -q '"phase":"setup"'
          curl -sf localhost:44101/studio.html | grep -q 'HARIS_MAPS_KEY = "ci-placeholder-key"'
      - name: Server output
        if: always()
        run: cat server.out || true
