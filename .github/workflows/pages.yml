name: Pages

# Publishes the showcase site and the online demo (recorded runs in the real interface) to GitHub Pages.
# One-time setup: Settings > Pages > Source: GitHub Actions, and a repository secret HARIS_MAPS_KEY_PAGES holding a
# Maps key restricted to https://<owner>.github.io/*.
on:
  push:
    branches: [moongazer]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site and demo
        env:
          HARIS_MAPS_KEY_PAGES: ${{ secrets.HARIS_MAPS_KEY_PAGES }}
        run: tools/build_pages.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
