services:
  haris:
    build: .
    ports:
      - "44101:44101"
    environment:
      - HARIS_MAPS_KEY          # taken from your shell or a .env file next to this one (git-ignored)
    volumes:
      - ./log:/app/log          # note: logs are currently written to /app, not /app/log (see docs/getting-started.md#logs)
